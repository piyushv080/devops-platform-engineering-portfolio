name: Promote one project file from dev to main

on:
  schedule:
    # Check hourly from 09:00 to 20:00 Asia/Kolkata (03:30 to 14:30 UTC).
    # A date-based gate below allows one varying promotion time per day.
    - cron: "30 3-14 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-dev-project-promotion
  cancel-in-progress: false

jobs:
  promote-one-file:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy the next project file and push it to main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main dev

          projects=(
            "event-driven-remediation"
            "healthcheck-automation"
            "OpsAgentX-Local"
          )

          today_ist="$(TZ=Asia/Kolkata date +%F)"
          day_number=$(( $(date -u -d "$today_ist" +%s) / 86400 ))
          current_hour=$((10#$(TZ=Asia/Kolkata date +%H)))
          # Select a different hour each day, rotating through 09:00–20:00 IST.
          target_hour=$((9 + (day_number * 7 % 12)))

          if (( current_hour < target_hour )); then
            echo "Today's promotion slot is ${target_hour}:00 Asia/Kolkata; checking again then."
            exit 0
          fi

          selected_file=""

          # Choose the first missing file, using the project order above and
          # Git's stable path ordering within each project.
          for project in "${projects[@]}"; do
            while IFS= read -r source_file; do
              [[ -n "$source_file" ]] || continue
              if ! git cat-file -e "origin/main:$source_file" 2>/dev/null; then
                selected_file="$source_file"
                break 2
              fi
            done < <(git ls-tree -r --name-only origin/dev -- "$project")
          done

          if [[ -z "$selected_file" ]]; then
            echo "All project files are already present on main. Disabling this workflow."
            gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/promote-dev-projects.yml/disable"
            exit 0
          fi

          if git log origin/main --format=%B | grep -Fqx "daily-promotion-date: $today_ist"; then
            echo "One file has already been promoted today; skipping the remaining scheduled checks."
            exit 0
          fi

          git checkout origin/dev -- "$selected_file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          content_summary="$(git show "origin/dev:$selected_file" | python3 -c '
          import sys
          for line in sys.stdin:
              summary = " ".join(line.split())
              if summary:
                  print(summary.lstrip("# ")[:52])
                  break
          ' )"
          if [[ -z "$content_summary" ]]; then
            content_summary="$selected_file"
          fi

          git commit \
            -m "Promote: $content_summary" \
            -m "File: $selected_file" \
            -m "Source branch: dev" \
            -m "daily-promotion-date: $today_ist"
          git push origin HEAD:main

          echo "Promoted one file: $selected_file"

          # If this was the final missing project file, stop future scheduled runs.
          more_files_remain=false
          for project in "${projects[@]}"; do
            while IFS= read -r source_file; do
              [[ -n "$source_file" ]] || continue
              [[ "$source_file" == "$selected_file" ]] && continue
              if ! git cat-file -e "HEAD:$source_file" 2>/dev/null; then
                more_files_remain=true
                break 2
              fi
            done < <(git ls-tree -r --name-only origin/dev -- "$project")
          done

          if [[ "$more_files_remain" == false ]]; then
            echo "All project files are now on main. Disabling this workflow."
            gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/promote-dev-projects.yml/disable"
          fi

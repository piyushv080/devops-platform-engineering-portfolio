---
# AWX entry point. Attach the ServiceNow Developer and AAP Read Only API
# credentials to the job template. Every role is read-only; email is disabled.
- name: Run automation and ServiceNow health reports
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    run_automation_health: true
    run_cmdb_health: true
    run_opportunity_miner: true
    health_role_failures: []

  tasks:
    - name: Run the AAP automation health report
      when: run_automation_health | bool
      block:
        - name: Include automation-health role
          ansible.builtin.include_role:
            name: automation-health
      rescue:
        - name: Record automation-health failure
          ansible.builtin.set_fact:
            health_role_failures: "{{ health_role_failures + ['automation-health failed; verify the AWX API credential, endpoint, and permissions.'] }}"

    - name: Run the ServiceNow CMDB health report
      when: run_cmdb_health | bool
      block:
        - name: Include cmdb-health role
          ansible.builtin.include_role:
            name: cmdb-health
      rescue:
        - name: Record cmdb-health failure
          ansible.builtin.set_fact:
            health_role_failures: "{{ health_role_failures + ['cmdb-health failed; verify ServiceNow credentials, CMDB table access, and query settings.'] }}"

    - name: Run the ServiceNow opportunity report
      when: run_opportunity_miner | bool
      block:
        - name: Include opportunity-miner role
          ansible.builtin.include_role:
            name: opportunity-miner
      rescue:
        - name: Record opportunity-miner failure
          ansible.builtin.set_fact:
            health_role_failures: "{{ health_role_failures + ['opportunity-miner failed; verify ServiceNow credentials and table access.'] }}"

    - name: Report role failures after all selected reports have run
      ansible.builtin.fail:
        msg: "One or more health reports failed: {{ health_role_failures | join('; ') }}"
      when: health_role_failures | length > 0

    - name: Report completion
      ansible.builtin.debug:
        msg: "All selected health reports completed. No records were changed."
      when: health_role_failures | length == 0

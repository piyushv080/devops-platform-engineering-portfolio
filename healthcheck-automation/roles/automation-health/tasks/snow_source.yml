---
# One ServiceNow source (service requests, change tasks or incidents). Included once per entry of
# health_snow_sources, with loop_var health_src. Read-only: GET requests only.
# A source that cannot be read adds a note and the others continue.
 
- name: "[{{ health_src.label }}] Read and match"
  block:
    - name: "[{{ health_src.label }}] Build the ServiceNow query"
      set_fact:
        health_src_query: |-
          {% set parts = ['sys_created_on>=javascript:gs.daysAgoStart(' ~ health_window_days ~ ')'] %}
          {% if health_src.mode == 'prefix' and (health_src.codes | default([]) | length) > 0 %}
          {% set _ = parts.append(health_src.codes | map('regex_replace', '^(.*)$', health_src.key_field ~ 'STARTSWITH\\1') | join('^OR')) %}
          {% elif health_src.fallback == 'groups' %}
          {% set ors = health_automation_users | map('regex_replace', '^(.*)$', 'assigned_to.user_name=\\1') | list %}
          {% if (health_src.manual_groups | default([]) | length) > 0 %}
          {% set _ = ors.append('assignment_group.nameIN' ~ (health_src.manual_groups | join(','))) %}
          {% endif %}
          {% set _ = parts.append(ors | join('^OR')) %}
          {% endif %}
          {{ parts | join('^') }}
        health_src_fields: >-
          {{ ([health_src.key_field, 'assignment_group.name', 'sys_created_on', 'number'] + health_src.handler_fields) | unique | join(',') }}
 
    - name: "[{{ health_src.label }}] Get the rows from [{{ health_src.table }}] for the last [{{ health_window_days }}] days"
      uri:
        url: >-
          {{ snow_base_url }}api/now/table/{{ health_src.table }}?sysparm_limit={{ health_snow_record_limit }}&sysparm_fields={{
          health_src_fields | urlencode }}&sysparm_query={{ health_src_query | urlencode }}
        url_username: "{{ snow_username }}"
        url_password: "{{ snow_password }}"
        force_basic_auth: yes
        validate_certs: "{{ snow_validate_certs }}"
        timeout: 300
      register: health_src_rows
      until: health_src_rows.status | default(-1) == 200
      retries: 3
      delay: 30
      failed_when: false
      no_log: "{{ not health_debug }}"
      delegate_to: localhost
 
    - name: "[{{ health_src.label }}] Check the ServiceNow call"
      assert:
        that:
          - health_src_rows.status | default(-1) == 200
        fail_msg: >-
          The ServiceNow call failed. URL base: {{ snow_base_url }}api/now/table/{{ health_src.table }}.
          HTTP status: {{ health_src_rows.status | default(-1) }}. Error text: {{ health_src_rows.msg | default('none') }}.
          401 = wrong credential. 403 = the integration user cannot read {{ health_src.table }}.
      delegate_to: localhost
 
    # For prefix sources: the template of each alert code (WIN04 -> win04-windows-server-unreachable).
    - name: "[{{ health_src.label }}] Find the template of each code"
      set_fact:
        health_src_prefix_map: |-
          {% set pm = {} %}
          {% for c in (health_src.codes | default([])) %}
          {% set hit = health_templates | select('search', '(?i)(^|-)' ~ c ~ '(-|_|$)') | list | sort %}
          {% if hit | length > 0 %}{% set _ = pm.update({c | lower: hit[0]}) %}{% endif %}
          {% endfor %}
          {{ pm }}
      when: health_src.mode == 'prefix'
 
    - name: "[{{ health_src.label }}] Match the rows to templates"
      set_fact:
        health_src_tickets: |-
          {% set out = [] %}
          {% set pm = health_src_prefix_map | default({}) %}
          {% for row in (health_src_rows.json.result | default([])) %}
          {% set raw = (row[health_src.key_field] | default('')) | string %}
          {% set hit = (raw | regex_search(health_src.key_regex, '\\1')) if health_src.key_regex else none %}
          {% set key = hit[0] if hit else raw %}
          {% set tpl = health_src.map.get(key, '') if health_src.mode == 'map' else pm.get(key | lower, '') %}
          {% if tpl %}
          {% set who = (health_src.handler_fields | map('extract', row) | select | list | first | default('')) %}
          {% set by_automation = who in health_automation_users %}
          {% if by_automation %}{% set grp = 'Automation' %}
          {% elif health_src.fallback == 'groups' %}{% set grp = row['assignment_group.name'] | default('') %}
          {% else %}{% set grp = health_manual_label %}{% endif %}
          {% set _ = out.append({'automation': tpl, 'assignment_group': grp}) %}
          {% endif %}
          {% endfor %}
          {{ out }}
 
    - name: "[{{ health_src.label }}] Keep the tickets and remember the groups"
      set_fact:
        health_tickets: "{{ health_tickets + health_src_tickets }}"
        health_all_manual_groups: "{{ health_all_manual_groups + (health_src.manual_groups | default([])) }}"
        health_snow_notes: >-
          {{ health_snow_notes + [
               '[' ~ health_src.label ~ '] rows read from ' ~ health_src.table ~ ': '
               ~ (health_src_rows.json.result | default([]) | length) ~ ' (in ServiceNow: ' ~ (health_src_rows.x_total_count | default('?')) ~ ')'
               ~ ' | matched to a template: ' ~ (health_src_tickets | length)
               ~ ' | fell back to manual: ' ~ (health_src_tickets | selectattr('assignment_group', 'in', (health_src.manual_groups | default([])) + [health_manual_label]) | list | length)
               ~ ((' | WARNING: more rows than health_snow_record_limit, the rest was not read') if (health_src_rows.x_total_count | default(0) | int) > (health_snow_record_limit | int) else '')
             ] }}
 
    - name: "[{{ health_src.label }}] Templates in the map that do not exist in AAP"
      debug:
        msg: "[{{ health_src.label }}] Template [{{ item.value }}] (key '{{ item.key }}') was not found in AAP. Fix the map."
      loop: "{{ health_src.map | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: health_src.mode == 'map' and item.value not in health_templates
 
    - name: "[{{ health_src.label }}] Alert codes with no matching template"
      debug:
        msg: "[{{ health_src.label }}] No AAP template name contains these codes: {{ health_src.codes | reject('in', health_src_prefix_map.keys() | map('upper') | list) | list }}"
      when: health_src.mode == 'prefix' and (health_src.codes | reject('in', health_src_prefix_map.keys() | map('upper') | list) | list | length) > 0
 
    # When nothing matched, show what ServiceNow returned so the map or the codes can be fixed.
    - name: "[{{ health_src.label }}] Most common values returned in [{{ health_src.key_field }}]"
      debug:
        msg: |-
          {% set counts = {} %}
          {% for row in (health_src_rows.json.result | default([])) %}
          {% set k = (row[health_src.key_field] | default('')) | string %}
          {% set _ = counts.update({k: counts.get(k, 0) + 1}) %}
          {% endfor %}
          {% for k, v in (counts.items() | list | sort(attribute='1', reverse=True))[:10] %}
          {{ v }} x {{ k }}
          {% endfor %}
          map keys: {{ (health_src.map | default({})).keys() | list | length }} (must equal one of these exactly)
      when: (health_src_tickets | length) == 0 and (health_src_rows.json.result | default([]) | length) > 0
 
  rescue:
    - name: "[{{ health_src.label }}] Remember the error"
      set_fact:
        health_snow_notes: >-
          {{ health_snow_notes + ['[' ~ health_src.label ~ '] could not be read: ' ~ ((ansible_failed_result.msg | default('failed')) | string | truncate(400))] }}
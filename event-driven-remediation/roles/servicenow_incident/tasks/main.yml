---
- name: Require ServiceNow credential values before changing the target
  ansible.builtin.assert:
    that:
      - snow_url | length > 0
      - snow_user | length > 0
      - snow_password | length > 0
    fail_msg: Attach the ServiceNow custom credential to this AWX job template.
  no_log: true

- name: Build the incident correlation key
  ansible.builtin.set_fact:
    incident_correlation_id: "{{ alert_payload.alertname | default('unknown') }}:{{ alert_payload.target | default('unknown') }}"

- name: Find an active incident already correlated to this alert
  ansible.builtin.uri:
    # The developer instance returns HTTP 500 when sysparm_fields is combined
    # with this filter. The same filtered request succeeds without that option.
    url: "{{ snow_url }}/api/now/table/incident?sysparm_query=correlation_id%3D{{ incident_correlation_id | urlencode }}%5Eactive%3Dtrue&sysparm_limit=1"
    method: GET
    user: "{{ snow_user }}"
    password: "{{ snow_password }}"
    force_basic_auth: true
    # The ServiceNow developer instance's ADC returned a generic 500 from the
    # AWX execution environment. Bypass any inherited proxy for this API call.
    use_proxy: false
    headers:
      Accept: application/json
    validate_certs: "{{ snow_validate_certs }}"
    return_content: true
    status_code: 200
  register: incident_lookup
  no_log: true
  # Preserve the registered response for the sanitized failure task below.
  failed_when: false

- name: Stop safely when the ServiceNow incident lookup fails
  ansible.builtin.fail:
    msg: >-
      ServiceNow incident lookup failed. HTTP status:
      {{ incident_lookup.status | default('no response') }}.
      API message:
      {{ incident_lookup.get('json', {}).get('error', {}).get('message', 'No API message returned.') }}.
      API detail:
      {{ incident_lookup.get('json', {}).get('error', {}).get('detail', incident_lookup.get('msg', 'No additional details returned.')) }}.
      Transaction ID:
      {{ incident_lookup.get('x_transaction_id', incident_lookup.get('x-transaction-id', 'not returned')) }}.
      Response body:
      {{ incident_lookup.get('content', 'No response body returned.') | string | truncate(1000, true) }}
  when: incident_lookup.status | default(0) | int != 200

- name: Reuse the existing correlated incident
  ansible.builtin.set_fact:
    snow_incident_sys_id: "{{ incident_lookup.json.result[0].sys_id }}"
    snow_incident_number: "{{ incident_lookup.json.result[0].number }}"
  when: incident_lookup.json.result | length > 0

- name: Create a ServiceNow incident for this alert
  ansible.builtin.uri:
    url: "{{ snow_url }}/api/now/table/incident"
    method: POST
    user: "{{ snow_user }}"
    password: "{{ snow_password }}"
    force_basic_auth: true
    headers:
      Accept: application/json
      Content-Type: application/json
    body_format: json
    body:
      short_description: "[{{ alert_payload.target }}] {{ alert_payload.alertname }}"
      description: "{{ alert_payload.description | default(alert_payload.summary | default('Monitoring alert received')) }}"
      correlation_id: "{{ incident_correlation_id }}"
      urgency: "2"
      impact: "2"
    validate_certs: "{{ snow_validate_certs }}"
    return_content: true
    status_code: 201
  register: incident_create
  when: incident_lookup.json.result | length == 0
  no_log: true

- name: Save the newly created incident identifiers
  ansible.builtin.set_fact:
    snow_incident_sys_id: "{{ incident_create.json.result.sys_id }}"
    snow_incident_number: "{{ incident_create.json.result.number }}"
  when: incident_lookup.json.result | length == 0
  no_log: true

- name: Add the detection work note before remediation
  ansible.builtin.uri:
    url: "{{ snow_url }}/api/now/table/incident/{{ snow_incident_sys_id }}"
    method: PATCH
    user: "{{ snow_user }}"
    password: "{{ snow_password }}"
    force_basic_auth: true
    headers:
      Accept: application/json
      Content-Type: application/json
    body_format: json
    body:
      work_notes: "Ansible AWX Job ID: {{ awx_job_id | default('unknown', true) }}. Automation received {{ alert_payload.alertname }} for {{ alert_payload.target }} (event {{ alert_payload.event_id }}). The approved demo remediation is starting."
    validate_certs: "{{ snow_validate_certs }}"
    status_code: 200
  register: work_note_update
  no_log: true
  failed_when: false

- name: Stop safely when adding the ServiceNow work note fails
  ansible.builtin.fail:
    msg: >-
      ServiceNow work-note update failed. HTTP status:
      {{ work_note_update.status | default('no response') }}.
      API message:
      {{ work_note_update.get('json', {}).get('error', {}).get('message', 'No API message returned.') }}.
      API detail:
      {{ work_note_update.get('json', {}).get('error', {}).get('detail', work_note_update.get('msg', 'No additional details returned.')) }}
  when: work_note_update.status | default(0) | int != 200

- name: Report the working incident reference
  ansible.builtin.debug:
    msg: "Working incident {{ snow_incident_number }} for {{ expected_target }}."

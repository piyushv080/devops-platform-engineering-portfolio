name: event-driven-remediation

services:
  demo-nginx:
    build: ./target
    ports:
      - "127.0.0.1:8081:80"
      - "2222:22"
    volumes:
      # Mounted to a staging path; the container copies it into place owned by
      # the ansible user, so it works whatever the host user's UID is.
      - ../secrets/authorized_keys:/run/ssh-keys/authorized_keys:ro
    restart: unless-stopped

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - blackbox-exporter
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../secrets/webhook-token:/run/secrets/webhook-token:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.0.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/event-driven-remediation.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../secrets/grafana-admin-password:/run/secrets/grafana-admin-password:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Keep the webhook listener on the same Compose network as Alertmanager.
  # This avoids routing container traffic through the WSL/Windows host boundary.
  rulebook:
    profiles: [event-driven]
    build:
      context: ..
      dockerfile: environment/rulebook/Dockerfile
    environment:
      EDA_CONTROLLER_TOKEN: ${EDA_CONTROLLER_TOKEN:-}
      EDA_CONTROLLER_URL: ${EDA_CONTROLLER_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../secrets/webhook-token:/app/secrets/webhook-token:ro
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

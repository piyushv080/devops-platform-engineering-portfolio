name: event-driven-remediation

services:
  demo-nginx:
    build: ./target
    ports:
      - "127.0.0.1:8081:80"
      - "2222:22"
    volumes:
      - ../secrets/authorized_keys:/home/ansible/.ssh/authorized_keys:ro
    restart: unless-stopped

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - blackbox-exporter
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../secrets/webhook-token:/run/secrets/webhook-token:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  # Keep the webhook listener on the same Compose network as Alertmanager.
  # This avoids routing container traffic through the WSL/Windows host boundary.
  rulebook:
    profiles: [event-driven]
    build:
      context: ..
      dockerfile: environment/rulebook/Dockerfile
    environment:
      EDA_CONTROLLER_TOKEN: ${EDA_CONTROLLER_TOKEN:-}
      EDA_CONTROLLER_URL: ${EDA_CONTROLLER_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../secrets/webhook-token:/app/secrets/webhook-token:ro
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:

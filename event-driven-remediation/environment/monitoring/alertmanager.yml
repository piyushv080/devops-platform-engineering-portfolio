route:
  receiver: awx-rulebook
  group_by: [alertname, target]
  group_wait: 2s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: awx-rulebook
    webhook_configs:
      - url: http://host.docker.internal:5000/endpoint
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/webhook-token
